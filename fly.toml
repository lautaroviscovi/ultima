# Fly.io — servidor de sockets.
#
# Vercel y Netlify NO sirven para esto: sus funciones son efimeras, no hay
# proceso persistente ni estado en memoria, y las conexiones WebSocket de larga
# duracion no son su modelo.

app = "uno-server"
primary_region = "eze"   # Buenos Aires; cambiar si el equipo esta en otro lado

# Margen para que el drain avise a los jugadores antes de cortar los sockets.
# CUIDADO: estas dos claves son de la raiz. Si quedan despues de una tabla como
# [[vm]], TOML las lee como parte de ESA tabla y se ignoran en silencio.
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true

  # CRITICO: las salas viven en memoria. Si la maquina se duerme, se mueren
  # todas las partidas en curso y el primer jugador se come el cold start.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Una sola instancia es la decision correcta para este caso: el estado de las
  # salas es local al proceso. Con varias, un jugador que aterriza en la
  # instancia B no encuentra la sala que vive en la A — y arreglarlo requiere
  # sticky sessions Y el adapter de Redis juntos. Una instancia de Node maneja
  # cientos de partidas: el trabajo por comando son microsegundos.
  [http_service.concurrency]
    type = "connections"
    hard_limit = 900
    soft_limit = 700

  [[http_service.checks]]
    grace_period = "8s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "4s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
