name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      # Gate de fase 1. Menos partidas que en local para no alargar CI, pero
      # suficientes para atrapar una regresion de reglas.
      - run: pnpm sim -- 200 10
      # Que los artefactos de deploy compilen de verdad, no solo los tests.
      - run: pnpm --filter @uno/server build
      - run: pnpm --filter @uno/client build
      # Los tests del Durable Object corren dentro de workerd real: probarlo
      # con mocks no cubriria el ciclo de vida del objeto ni las alarms.
      - run: pnpm --filter @uno/worker test
